; LEO Desktop — ESP32 TFT kiosk (PlatformIO)
;
; The ESP32 only DISPLAYS what the desktop agent sends and REPORTS touches.
; It never runs commands. Every message after pairing is HMAC-SHA256 signed.
; Protocol: ../../docs/PROTOCOL.md
;
;   pio run -t upload        build + flash (COM9)
;   python ..\tools\tft_test.py   protocol test from the PC (close any serial monitor first)
;
; Wiring is the one already working on this board (from the chiguru / Campus Mithra
; projects): 2.8" ILI9341 + XPT2046 on one SPI bus. Do not rewire.

[platformio]
default_envs = leo_ili9341
; Same Windows workaround as chiguru: the project path contains spaces ("Pavan Kumar H"),
; so build output goes to a path without spaces and the toolchain is reached via the
; C:\pio junction (= %USERPROFILE%\.platformio). See scripts/long_cmdline_win.py.
build_dir   = C:/pio-build/leo_tft
libdeps_dir = C:/pio-build/leo_tft/libdeps
core_dir    = C:/pio

[env]
extra_scripts = pre:scripts/long_cmdline_win.py

[env:leo_ili9341]
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino
upload_port   = COM9
monitor_port  = COM9
upload_speed  = 921600
; Must match SERIAL_BAUD in include/config.h and the desktop side.
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D TOUCH_CS=21
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=5000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=0
